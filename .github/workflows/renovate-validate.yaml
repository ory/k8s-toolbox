name: Validation - Renovate
on:
  merge_group:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
    branches:
      - master

jobs:
  validate:
    name: Validate Renovate
    timeout-minutes: 5
    runs-on: ubuntu-latest
    if: github.event_name == 'merge_group' || github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          base: master
          filters: |
            renovate:
              - 'renovate.json'
      - name: Validate Renovate config
        if: ${{ steps.filter.outputs.renovate == 'true' }}
        uses: suzuki-shunsuke/github-action-renovate-config-validator@ee9f69e1f683ed0d08225086482b34fc9abe9300 # v2.1.0
