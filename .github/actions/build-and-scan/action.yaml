---
name: 'Build and Scan docker image'
description: 'Builds and scans docker image'
inputs:
  labels:
    required: false
    default: '[]'
    description: Set of image labels
  tags:
    required: true
    description: Set of image tags
runs:
  using: "composite"
  steps:
    - name: Declare some variables
      id: vars
      shell: bash
      run: |
        echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    - name: Set up QEMU
      uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Build
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
      with:
        context: ./docker
        push: false
        tags: ${{ inputs.tags }}
        labels: ${{ inputs.labels }}
        load: true

    - name: Anchore Scanner
      uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7
      if: always()
      id: grype-scan
      with:
        image: oryd/k8s-toolbox:sha-${{ steps.vars.outputs.sha_short }}
        fail-build: true
        severity-cutoff: high
        only-fixed: true

    - name: Inspect action SARIF report
      shell: bash
      if: always()
      run: |
        echo "::group::Anchore Scan Details"
        jq '.runs[0].results' ${{ steps.grype-scan.outputs.sarif }}
        echo "::endgroup::"

    - name: Dockle Linter
      uses: erzz/dockle-action@e8a7c41f36f1236ca3282b298d425ffbfdb2e922 # v1.4.1
      if: always()
      with:
        image: oryd/k8s-toolbox:sha-${{ steps.vars.outputs.sha_short }}
        exit-code: 42
        failure-threshold: fatal
